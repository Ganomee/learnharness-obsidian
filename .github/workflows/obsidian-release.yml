name: LearnHarness Obsidian release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learnharness-obsidian/package-lock.json

      - name: Validate release tag against plugin manifest
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./learnharness-obsidian/plugin/manifest.json').version")"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be semantic version X.Y.Z without a v prefix; received '$tag'."
            exit 1
          fi
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag '$tag' does not match plugin manifest version '$version'."
            exit 1
          fi

      - name: Install dependencies
        working-directory: learnharness-obsidian
        run: npm ci --ignore-scripts

      - name: Build the plugin and its notices
        working-directory: learnharness-obsidian
        run: npm run build

      - name: Package manual-install archive
        shell: bash
        run: |
          cd learnharness-obsidian/plugin/dist
          zip -r "../../../learnharness-lab-${GITHUB_REF_NAME}.zip" \
            main.js manifest.json styles.css LICENSE NOTICE.md \
            THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES

      - name: Publish BRAT-compatible release assets
        uses: softprops/action-gh-release@v2
        with:
          name: LearnHarness Lab ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            learnharness-obsidian/plugin/dist/main.js
            learnharness-obsidian/plugin/dist/manifest.json
            learnharness-obsidian/plugin/dist/styles.css
            learnharness-obsidian/plugin/dist/LICENSE
            learnharness-obsidian/plugin/dist/NOTICE.md
            learnharness-obsidian/plugin/dist/THIRD_PARTY_NOTICES.md
            learnharness-lab-${{ github.ref_name }}.zip
